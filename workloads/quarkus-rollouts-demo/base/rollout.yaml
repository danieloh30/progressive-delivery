apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: quarkus-demo
  namespace: quarkus-demo
  labels:
    app: quarkus-demo
    app.kubernetes.io/name: quarkus-demo
    app.kubernetes.io/part-of: quarkus-demo-app
    app.openshift.io/runtime: quarkus
    app.kubernetes.io/component: backend
  annotations:
    app.openshift.io/vcs-uri: https://github.com/danieloh30/progressive-delivery
spec:
  replicas: 10
  revisionHistoryLimit: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: quarkus-demo
  template:
    metadata:
      labels:
        app: quarkus-demo
        app.kubernetes.io/name: quarkus-demo
        app.kubernetes.io/part-of: quarkus-demo-app
        app.openshift.io/runtime: quarkus
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: quarkus-demo
      containers:
      - name: quarkus-demo
#        image: quay.io/danieloh30/argo-rollouts-quarkus-demo:v1.stable
        image: quay.io/danieloh30/argo-rollouts-quarkus-demo:1.0.0
#        image: quay.io/danieloh30/argo-rollouts-quarkus-demo:v2.nullpointer
#        image: quay.io/danieloh30/argo-rollouts-quarkus-demo:v3.memoryleak
#        image: quay.io/danieloh30/argo-rollouts-quarkus-demo:v4.slowdependency
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        env:
        - name: ROLLOUT_NAME
          value: "quarkus-demo"
        - name: ROLLOUT_NAMESPACE
          value: "quarkus-demo"
  strategy:
    canary:
      # Add revision labels to stable and canary pods
      stableMetadata:
        labels:
          role: stable
      canaryMetadata:
        labels:
          role: canary
      analysis:
        startingStep: 2 # delay starting analysis run until we have collected enough metrics
        args:
        - name: service-name
          value: quarkus-demo-canary.quarkus-demo.svc.cluster.local
        - name: stable-pod-label
          value: app=quarkus-demo,role=stable
        - name: canary-pod-label
          value: app=quarkus-demo,role=canary
        - name: namespace
          value: quarkus-demo
        - name: canary-pod
          valueFrom:
            podTemplateHashValue: Latest
        templates:
          #- templateName: success-rate
          - templateName: ai-analysis-agent
      canaryService: quarkus-demo-canary
      stableService: quarkus-demo-stable
      trafficRouting:
        plugins:
          argoproj-labs/openshift:
            routes:
            - quarkus-demo
      steps:
      - setWeight: 10
      - pause: { duration: 10s } # 10 seconds to start gathering metrics before starting analysis
      - setWeight: 10
      - pause: { duration: 40s } # 40 seconds to let the analysis do its job
      - setWeight: 60
      - pause: { duration: 20s } # if everything is going well, continue rolling out but give some time to manually abort if needed
      - setWeight: 100
      - pause: { duration: 10s } # finish rolling out to everyone
