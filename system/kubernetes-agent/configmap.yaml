apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-agent-config
  namespace: openshift-gitops
data:
  # Default model configuration (gpt-4.1-mini via OpenAI)
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4.1-mini"

  # Remediation model configuration
  REM_BASE_URL: "https://api.openai.com/v1"
  REM_MODEL: "gpt-4.1-mini"
  
  # Profile selection - set to 'prod,openai' or 'prod,gemini'
  QUARKUS_PROFILE: "prod,openai"